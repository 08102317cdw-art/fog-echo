name: 构建并部署网页游戏

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 从 v1.1 源码构建网页版
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 缓存官方引擎与模板
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/4.3.stable
            .godot-tools
          key: godot-linux-web-4.3-stable-v2
      - name: 安装 Godot 官方引擎和网页模板
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-tools "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .godot-tools
          chmod +x .godot-tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz 'templates/web_nothreads_*.zip' -d "$HOME/.local/share/godot/export_templates/4.3.stable"
      - name: 验证原有剧情流程
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 180 .godot-tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path game --editor --import
          xvfb-run -a timeout 180 .godot-tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --path game --fixed-fps 60 --disable-render-loop res://dev/test_flow.tscn 2>&1 | tee /tmp/flow.log
          grep -F 'gate_open=true' /tmp/flow.log
          grep -F 'ending flag=true' /tmp/flow.log
          grep -F 'done' /tmp/flow.log
          # 原工程结束测试时会报告资源释放提示，保留日志，并单独拒绝其他运行错误。
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/flow.log | grep -vE 'ERROR: [0-9]+ resources still in use at exit'; then exit 1; fi
      - name: 导入资源并构建
        run: |
          mkdir -p dist
          .godot-tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path game --editor --import
          .godot-tools/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path game --export-release Web ../dist/index.html
          python3 tools/prepare_web.py
          cp LICENSE.md THIRD_PARTY_NOTICES.md dist/
          cp -r licenses dist/
          cp docs/v1.2_CREDITS.txt dist/CREDITS.txt
          touch dist/.nojekyll
      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布游玩链接
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
